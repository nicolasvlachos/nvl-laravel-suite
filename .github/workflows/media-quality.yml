name: NVL Media quality

on:
  pull_request:
    paths:
      - packages/nvl/media/**
      - .github/workflows/media-quality.yml
  push:
    branches:
      - main
    paths:
      - packages/nvl/media/**
      - .github/workflows/media-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-matrix:
    name: Media / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '13'
            testbench: '11'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, gd, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Select framework line
        run: |
          composer require --no-update \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            "laravel/tinker:^${{ matrix.laravel == '12' && '2.10.1' || '3.0' }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Validate Media manifest
        run: composer validate --strict packages/nvl/media/composer.json

      - name: Format Media
        run: |
          vendor/bin/pint --format agent packages/nvl/media
          git diff --exit-code -- packages/nvl/media

      - name: Analyse Media at maximum level
        run: |
          vendor/bin/phpstan analyse \
            packages/nvl/media/src \
            packages/nvl/media/database/factories \
            packages/nvl/media/database/seeders \
            packages/nvl/media/tests/Stubs/TestMediaModel.php \
            --level=max \
            --no-progress \
            --memory-limit=2G

      - name: Analyse Media dependencies
        run: |
          ln -s ../../../vendor packages/nvl/media/vendor
          cd packages/nvl/media
          trap 'unlink vendor' EXIT
          vendor/bin/composer-dependency-analyser \
            --config composer-dependency-analyser.php

      - name: Test Media
        run: |
          vendor/bin/pest \
            --test-directory=packages/nvl/media/tests \
            --configuration=packages/nvl/media/phpunit.xml.dist \
            --bootstrap=vendor/autoload.php \
            --compact \
            packages/nvl/media/tests

      - name: Audit installed dependencies
        run: composer audit --locked --no-interaction

  production-stack:
    name: Media / PostgreSQL / Redis / MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nvl_media
          POSTGRES_USER: nvl_media
          POSTGRES_PASSWORD: nvl_media
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nvl_media"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, libxml, mbstring, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Start pinned MinIO
        run: |
          docker run --detach \
            --name nvl-media-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs nvl-media-minio
          exit 1

      - name: Test Media production stack
        env:
          NVL_MEDIA_PRODUCTION_INTEGRATION: 'true'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nvl_media
          DB_USERNAME: nvl_media
          DB_PASSWORD: nvl_media
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: nvl-media
        run: |
          vendor/bin/pest \
            --test-directory=packages/nvl/media/tests \
            --configuration=packages/nvl/media/phpunit.xml.dist \
            --bootstrap=vendor/autoload.php \
            --compact \
            packages/nvl/media/tests/Integration

name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require the default branch and a semantic version
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from the default branch [$DEFAULT_BRANCH]." >&2
            exit 1
          fi
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$PACKAGE_VERSION" =~ $semver_pattern ]]; then
            echo "Release version [$PACKAGE_VERSION] is not valid semantic versioning without a v prefix." >&2
            exit 1
          fi

  checks:
    name: Release quality gates
    needs: validate
    uses: ./.github/workflows/package-quality.yml

  archive:
    name: Suite archive and clean consumer
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, pdo_sqlite, tokenizer, xmlwriter, zip
          coverage: none
          tools: composer:2.10.2

      - run: bash tools/retry-composer.sh install --no-interaction --prefer-dist

      - name: Validate release changelogs
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [[ -z "$previous_tag" ]]; then
            echo 'A previous stable release tag is required.' >&2
            exit 1
          fi
          previous_source="$(git rev-parse "$previous_tag^{commit}^")"
          mapfile -t changed_packages < <(
            git diff --name-only "$previous_source...HEAD" -- packages/nvl \
              | awk -F/ 'NF >= 4 {print $3}' \
              | sort -u
          )
          : > /tmp/nvl-release-changed-packages
          if ((${#changed_packages[@]})); then
            printf '%s\n' "${changed_packages[@]}" \
              > /tmp/nvl-release-changed-packages
          fi
          php tools/check-release-changelogs.php \
            "$PACKAGE_VERSION" "${changed_packages[@]}"

      - name: Build and inspect the suite archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; (new Composer\Semver\VersionParser)->normalize($argv[1]);' "$PACKAGE_VERSION"
          mkdir -p build/archives
          COMPOSER_ROOT_VERSION="$PACKAGE_VERSION" composer archive \
            --format=zip \
            --dir="$GITHUB_WORKSPACE/build/archives"
          archive_count="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' | wc -l | tr -d ' ')"
          test "$archive_count" -eq 1
          archive="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
          unzip -p "$archive" composer.json \
            | jq -e '.name == "nvl/laravel-suite" and (.version | not)'
          expected_top_level=/tmp/nvl-expected-top-level
          actual_top_level=/tmp/nvl-actual-top-level
          sort -u tools/release-archive-top-level.txt > "$expected_top_level"
          unzip -Z1 "$archive" \
            | awk -F/ 'NF {print $1}' \
            | sort -u > "$actual_top_level"
          diff -u "$expected_top_level" "$actual_top_level"
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(vendor|node_modules|tests?|build|tmp|\.temp|\.phpunit\.cache)(/|$)|(^|/)(phpunit[^/]*\.xml[^/]*|phpstan[^/]*\.neon[^/]*|composer-dependency-analyser\.php|composer-require-checker\.json)$|(^|/)\.(DS_Store|gitattributes|gitignore|gitkeep)$'; then
            echo 'The release archive contains development-only paths.' >&2
            exit 1
          fi
          unzip -q "$archive" -d /tmp/nvl-suite-artifact
          mapfile -t changed_packages \
            < /tmp/nvl-release-changed-packages
          php tools/check-release-changelogs.php \
            "$PACKAGE_VERSION" \
            --root=/tmp/nvl-suite-artifact \
            "${changed_packages[@]}"

      - name: Rehearse Auth upgrade from v1.0.1
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-auth-upgrade-consumer
          cd /tmp/nvl-auth-upgrade-consumer
          composer config repositories.nvl-v1 vcs https://github.com/nicolasvlachos/nvl-laravel-suite.git
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "nvl/laravel-suite:1.0.1"
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/suite-release-consumer/app/Providers/AppServiceProvider.php" \
            app/Providers/AppServiceProvider.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/suite-release-consumer/config/nvl-release-consumer.php" \
            config/nvl-release-consumer.php
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          export QUEUE_CONNECTION=database
          export DB_QUEUE_RETRY_AFTER=960
          export NVL_AUTH_INVITATIONS_ENABLED=true
          export NVL_AUTH_MAGIC_LINKS_ENABLED=true
          php artisan migrate --force
          composer config --unset repositories.nvl-v1
          repository_config="$(jq -nc \
            --arg url /tmp/nvl-suite-artifact \
            --arg version "$PACKAGE_VERSION" \
            '{type:"path",url:$url,options:{symlink:false,versions:{"nvl/laravel-suite":$version}}}')"
          composer config repositories.nvl-candidate "$repository_config"
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "nvl/laravel-suite:$PACKAGE_VERSION"
          test ! -L vendor/nvl/laravel-suite
          php artisan migrate --force
          doctor_json="$(APP_ENV=testing MAIL_MAILER=array \
            QUEUE_CONNECTION=database DB_QUEUE_RETRY_AFTER=960 \
            php artisan nvl:auth:doctor --strict --format=json)"
          printf '%s\n' "$doctor_json"
          jq -e '
            .ready == true
            and any(.checks[]; .name == "schema.nvl_auth_invitations.columns" and .passed == true)
            and any(.checks[]; .name == "schema.nvl_auth_invitations.index.nvl_auth_invitations_context_hash_index" and .passed == true)
            and any(.checks[]; .name == "schema.nvl_auth_challenges.columns" and .passed == true)
            and any(.checks[]; .name == "schema.nvl_auth_challenges.index.nvl_auth_challenges_secondary_secret_hash_unique" and .passed == true)
          ' <<< "$doctor_json"

      - name: Install and exercise the suite archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-suite-consumer
          cd /tmp/nvl-suite-consumer
          repository_config="$(jq -nc \
            --arg url /tmp/nvl-suite-artifact \
            --arg version "$PACKAGE_VERSION" \
            '{type:"path",url:$url,options:{symlink:false,versions:{"nvl/laravel-suite":$version}}}')"
          composer config repositories.nvl "$repository_config"
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "nvl/laravel-suite:$PACKAGE_VERSION"
          test ! -L vendor/nvl/laravel-suite
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/suite-release-consumer/app/Providers/AppServiceProvider.php" \
            app/Providers/AppServiceProvider.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/suite-release-consumer/config/nvl-release-consumer.php" \
            config/nvl-release-consumer.php
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          export QUEUE_CONNECTION=database
          export DB_QUEUE_RETRY_AFTER=960
          php artisan package:discover
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $principal = new class extends Nvl\Auth\Models\User {
              protected $fillable = ["host_reference"];
          };
          $principal->fill([
              "host_reference" => "preserved",
              "name" => "Package Principal",
              "unlisted_extension" => "blocked",
          ]);
          if ($principal->host_reference !== "preserved"
              || $principal->name !== "Package Principal"
              || $principal->unlisted_extension !== null) {
              throw new RuntimeException("The archive does not preserve host principal fillable fields safely.");
          }
          '
          publish_tags=/tmp/nvl-publish-tags
          jq -r '.suite.publish_tags[], .packages[].publish_tags[]' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            | sort -u > "$publish_tags"
          while IFS= read -r tag; do
            php artisan vendor:publish --tag="$tag" --force
          done < "$publish_tags"
          test -f config/nvl-suite.php
          test -f nvl-auth.principals.json
          test -f mail-notifications.adoption.json
          test -f nvl-data.eslint.config.js
          test -f .nvl-data.prettierignore
          while IFS= read -r package; do
            test -f ".agents/skills/nvl-$package/SKILL.md"
            test -f "vendor/nvl/laravel-suite/resources/boost/skills/nvl-$package/SKILL.md"
          done < <(php -r '$catalog = require $argv[1]; echo implode(PHP_EOL, $catalog["packages"]);' "$GITHUB_WORKSPACE/tools/package-family.php")
          for source in "$GITHUB_WORKSPACE"/packages/nvl/*/config/*.php; do
            test -f "config/$(basename "$source")"
          done
          for source in "$GITHUB_WORKSPACE"/packages/nvl/*/database/migrations/*.php; do
            migration="$(basename "$source")"
            suffix="${migration:18}"
            compgen -G "database/migrations/*_$suffix" >/dev/null
          done
          while IFS= read -r source; do
            package="${source#"$GITHUB_WORKSPACE/packages/nvl/"}"
            package="${package%%/*}"
            relative="${source#"$GITHUB_WORKSPACE/packages/nvl/$package/lang/"}"
            test -f "lang/vendor/$package/$relative"
          done < <(find "$GITHUB_WORKSPACE"/packages/nvl/*/lang -type f ! -name '.gitkeep' -print)
          while IFS= read -r source; do
            relative="${source#"$GITHUB_WORKSPACE/packages/nvl/content/resources/views/"}"
            test -f "resources/views/vendor/nvl-content/$relative"
          done < <(find "$GITHUB_WORKSPACE/packages/nvl/content/resources/views" -type f -print)
          while IFS= read -r source; do
            relative="${source#"$GITHUB_WORKSPACE/packages/nvl/templates/resources/views/"}"
            test -f "resources/views/vendor/nvl-templates/$relative"
          done < <(find "$GITHUB_WORKSPACE/packages/nvl/templates/resources/views" -type f -print)
          while IFS= read -r source; do
            relative="${source#"$GITHUB_WORKSPACE/packages/nvl/mail-notifications/resources/views/mail/"}"
            test -f "resources/views/vendor/mail/$relative"
          done < <(find "$GITHUB_WORKSPACE/packages/nvl/mail-notifications/resources/views/mail" -type f -print)
          echo 'NVL_RELEASE_PUBLISHED_MIGRATIONS=true' >> .env
          rm -f database/database.sqlite
          touch database/database.sqlite
          php artisan config:clear
          php artisan config:cache
          php artisan migrate --force
          expected_doctors=/tmp/nvl-expected-doctors
          available_doctors=/tmp/nvl-available-doctors
          jq -r \
            '.packages[].commands // {} | to_entries[] | .value | split(" ")[0] | select(endswith(":doctor"))' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            | sort -u > "$expected_doctors"
          php artisan list --raw \
            | awk '$1 ~ /^nvl:.*:doctor$/ {print $1}' \
            | sort -u > "$available_doctors"
          diff -u "$expected_doctors" "$available_doctors"
          while IFS= read -r doctor; do
            APP_ENV=testing MAIL_MAILER=array \
              QUEUE_CONNECTION=database DB_QUEUE_RETRY_AFTER=960 \
              php artisan "$doctor" --strict --format=json
          done < "$expected_doctors"
          bash "$GITHUB_WORKSPACE/tools/retry-composer.sh" audit --locked --no-interaction

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvl-laravel-suite-v${{ inputs.version }}
          path: build/archives/nvl-laravel-suite-*.zip
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish clean tag and GitHub release
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nvl-laravel-suite-v${{ inputs.version }}
          path: build/archives

      - name: Create immutable clean distribution tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          archive="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
          test -n "$archive"
          release_tree="$RUNNER_TEMP/nvl-laravel-suite-$PACKAGE_VERSION"
          mkdir -p "$release_tree"
          unzip -q "$archive" -d "$release_tree"

          export GIT_INDEX_FILE="$RUNNER_TEMP/nvl-release-index"
          git read-tree --empty
          git --work-tree="$release_tree" add --all --force -- .
          tree="$(git write-tree)"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            if [[ "$(git cat-file -t "$tag")" != tag ]]; then
              echo "Existing release tag [$tag] is not annotated." >&2
              exit 1
            fi
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$(git show -s --format=%T "$tagged_commit")" != "$tree" ]]; then
              echo "Existing release tag [$tag] does not contain the verified archive tree." >&2
              exit 1
            fi
            if [[ "$(git show -s --format=%P "$tagged_commit")" != "$GITHUB_SHA" ]]; then
              echo "Existing release tag [$tag] was not built from commit [$GITHUB_SHA]." >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            release_commit="$(printf 'release: nvl/laravel-suite %s\n' "$PACKAGE_VERSION" | git commit-tree "$tree" -p "$GITHUB_SHA")"
            git tag -a "$tag" "$release_commit" -m "NVL Laravel Suite $PACKAGE_VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish immutable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          archive="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
          test -n "$archive"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p build/existing-release
            gh release download \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'nvl-laravel-suite-*.zip' \
              --dir build/existing-release
            existing_archive="$(find build/existing-release -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
            test -n "$existing_archive"
            cmp -s "$archive" "$existing_archive"
          else
            release_flags=()
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create \
              "$tag" \
              "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "NVL Laravel Suite $PACKAGE_VERSION" \
              "${release_flags[@]}"
          fi

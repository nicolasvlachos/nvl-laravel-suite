name: Package release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release quality gates
    uses: ./.github/workflows/package-quality.yml

  archive:
    name: Suite archive and clean consumer
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, pdo_sqlite, tokenizer, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Build and inspect the suite archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="${PACKAGE_VERSION#v}"
          php -r 'require "vendor/autoload.php"; (new Composer\Semver\VersionParser)->normalize($argv[1]);' "$package_version"
          mkdir -p build/archives
          COMPOSER_ROOT_VERSION="$package_version" composer archive \
            --format=zip \
            --dir="$GITHUB_WORKSPACE/build/archives"
          archive_count="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' | wc -l | tr -d ' ')"
          test "$archive_count" -eq 1
          archive="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
          unzip -p "$archive" composer.json \
            | jq -e '.name == "nvl/laravel-suite" and (.version | not)'
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(vendor|node_modules|tests|\.temp)(/|$)'; then
            echo 'The release archive contains development-only paths.' >&2
            exit 1
          fi
          unzip -q "$archive" -d /tmp/nvl-suite-artifact
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install and exercise the suite archive
        shell: bash
        run: |
          set -euo pipefail
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-suite-consumer
          cd /tmp/nvl-suite-consumer
          repository_config="$(jq -nc \
            --arg url /tmp/nvl-suite-artifact \
            --arg version "$PACKAGE_VERSION" \
            '{type:"path",url:$url,options:{symlink:false,versions:{"nvl/laravel-suite":$version}}}')"
          composer config repositories.nvl "$repository_config"
          composer require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "nvl/laravel-suite:$PACKAGE_VERSION"
          test ! -L vendor/nvl/laravel-suite
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan package:discover
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force
          publish_tags=/tmp/nvl-publish-tags
          jq -r '.packages[].publish_tags[]' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            > "$publish_tags"
          while IFS= read -r tag; do
            php artisan vendor:publish --tag="$tag" --force
          done < "$publish_tags"
          php artisan migrate --force
          expected_doctors=/tmp/nvl-expected-doctors
          available_doctors=/tmp/nvl-available-doctors
          jq -r \
            '.packages[].commands // {} | to_entries[] | .value | split(" ")[0] | select(endswith(":doctor"))' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            | sort -u > "$expected_doctors"
          php artisan list --raw \
            | awk '$1 ~ /^nvl:.*:doctor$/ {print $1}' \
            | sort -u > "$available_doctors"
          diff -u "$expected_doctors" "$available_doctors"
          while IFS= read -r doctor; do
            APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=sync \
              php artisan "$doctor" --strict --format=json
          done < "$expected_doctors"
          composer audit --locked --no-interaction

      - uses: actions/upload-artifact@v4
        with:
          name: nvl-laravel-suite-${{ github.ref_name }}
          path: build/archives/nvl-laravel-suite-*.zip
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub release
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nvl-laravel-suite-${{ github.ref_name }}
          path: build/archives

      - name: Publish immutable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$(find build/archives -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
          test -n "$archive"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p build/existing-release
            gh release download \
              "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'nvl-laravel-suite-*.zip' \
              --dir build/existing-release
            existing_archive="$(find build/existing-release -maxdepth 1 -name 'nvl-laravel-suite-*.zip' -print -quit)"
            test -n "$existing_archive"
            cmp -s "$archive" "$existing_archive"
          else
            package_version="${GITHUB_REF_NAME#v}"
            release_flags=()
            if [[ "$package_version" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create \
              "$GITHUB_REF_NAME" \
              "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "NVL Laravel Suite $package_version" \
              "${release_flags[@]}"
          fi

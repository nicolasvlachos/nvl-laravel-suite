name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Existing release tag or commit to upgrade from
        required: true
        type: string
      baseline_version:
        description: Semantic version assigned to baseline archives
        required: true
        default: 1.0.0
        type: string
      candidate_version:
        description: Semantic version assigned to candidate archives
        required: true
        default: 1.1.0
        type: string

permissions:
  contents: read

jobs:
  upgrade-rehearsal:
    name: Upgrade ${{ inputs.baseline_version }} to ${{ inputs.candidate_version }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nvl
          MYSQL_USER: nvl
          MYSQL_PASSWORD: nvl
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nvl
          POSTGRES_USER: nvl
          POSTGRES_PASSWORD: nvl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nvl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && '/tmp/nvl-upgrade-consumer/database/database.sqlite' || 'nvl' }}
      DB_USERNAME: nvl
      DB_PASSWORD: nvl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Build baseline and candidate archives
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          mkdir -p build/rehearsal/baseline build/rehearsal/candidate
          for directory in baseline/packages/nvl/*; do
            COMPOSER_ROOT_VERSION="$BASELINE_VERSION" composer archive \
              --working-dir="$directory" \
              --format=zip \
              --dir="$GITHUB_WORKSPACE/build/rehearsal/baseline"
          done
          for directory in packages/nvl/*; do
            package="$(basename "$directory")"
            COMPOSER_ROOT_VERSION="$CANDIDATE_VERSION" composer archive \
              --working-dir="$directory" \
              --format=zip \
              --dir="$GITHUB_WORKSPACE/build/rehearsal/candidate"
            archive="$(find build/rehearsal/candidate -maxdepth 1 -name "nvl-$package-*.zip" -print -quit)"
            php tools/inspect-package-archive.php "$archive" "$package"
          done
          php tools/build-archive-repository.php build/rehearsal/baseline "$BASELINE_VERSION"
          php tools/build-archive-repository.php build/rehearsal/candidate "$CANDIDATE_VERSION"

      - name: Install baseline
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version }}
        run: |
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-upgrade-consumer
          cd /tmp/nvl-upgrade-consumer
          composer config repositories.nvl composer "file://$GITHUB_WORKSPACE/build/rehearsal/baseline"
          packages=()
          for directory in "$GITHUB_WORKSPACE"/baseline/packages/nvl/*; do
            packages+=("nvl/$(basename "$directory"):$BASELINE_VERSION")
          done
          composer require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "${packages[@]}"
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          while read -r doctor; do
            if [ "$doctor" = "nvl:auth:doctor" ]; then
              APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=sync \
                php artisan "$doctor" --strict --format=json
            else
              APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=sync \
                php artisan "$doctor" --format=json
            fi
          done < <(php artisan list --raw | awk '$1 ~ /^nvl:.*:doctor$/ {print $1}')

      - name: Upgrade to candidate and validate
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          cd /tmp/nvl-upgrade-consumer
          composer config repositories.nvl composer "file://$GITHUB_WORKSPACE/build/rehearsal/candidate"
          packages=()
          for directory in "$GITHUB_WORKSPACE"/packages/nvl/*; do
            packages+=("nvl/$(basename "$directory"):$CANDIDATE_VERSION")
          done
          composer require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "${packages[@]}"
          cp "$GITHUB_WORKSPACE/app/Models/IntegrationTestModel.php" app/Models/IntegrationTestModel.php
          cp "$GITHUB_WORKSPACE/app/Providers/AppServiceProvider.php" app/Providers/AppServiceProvider.php
          cp \
            "$GITHUB_WORKSPACE/database/migrations/2026_07_25_205913_create_integration_test_models_table.php" \
            database/migrations/2026_07_25_205913_create_integration_test_models_table.php
          composer dump-autoload --no-interaction
          php artisan config:clear
          php artisan package:discover
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force
          while read -r tag; do
            php artisan vendor:publish --tag="$tag" --force
          done < <(jq -r '.packages[].publish_tags[]' "$GITHUB_WORKSPACE/tools/package-contracts.json")
          php artisan migrate --force
          run_doctors() {
            while read -r doctor; do
              if [ "$doctor" = "nvl:auth:doctor" ]; then
                APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=sync \
                  php artisan "$doctor" --strict --format=json
              else
                APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=sync \
                  php artisan "$doctor" --strict --format=json
              fi
            done < <(php artisan list --raw | awk '$1 ~ /^nvl:.*:doctor$/ {print $1}')
          }
          run_doctors
          "$GITHUB_WORKSPACE/tools/run-comments-production-consumer.sh" \
            /tmp/nvl-upgrade-consumer
          php artisan migrate:rollback --force
          # Forward-only package downs retain schema by design. Rebuild this
          # disposable rehearsal database before validating a clean candidate.
          php artisan migrate:fresh --force
          run_doctors
          composer audit --locked --no-interaction

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rehearsal-${{ matrix.database }}
          path: |
            build/rehearsal
            /tmp/nvl-upgrade-consumer/composer.lock

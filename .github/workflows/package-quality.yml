name: Package quality

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, analysis, manifests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Repository contract tests
        run: vendor/bin/pest --compact tests/Contract

      - name: Validate Composer manifests
        run: |
          composer validate --strict
          for manifest in packages/nvl/*/composer.json; do
            composer validate --strict "$manifest"
          done

      - name: Validate optimized autoloading
        run: composer autoload:check

      - name: Validate architecture and public contracts
        run: |
          composer packages:validate
          composer contracts:check

      - name: Static analysis
        run: |
          composer analyse
          composer packages:analyse

      - name: Formatting
        run: composer format:test

  current-tests:
    name: PHP 8.4 / Laravel 13 / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Select Laravel 13
        run: |
          composer require --no-update \
            "laravel/framework:^13.0" \
            "laravel/tinker:^3.0" \
            "orchestra/testbench:^11.0"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Complete test suite
        run: composer test

  laravel12-lowest:
    name: PHP 8.3 / Laravel 12 / lowest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Select Laravel 12
        run: |
          composer require --no-update \
            "laravel/framework:^12.0" \
            "laravel/tinker:^2.10.1" \
            "orchestra/testbench:^10.0"

      - name: Install lowest supported dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies --prefer-lowest

      - name: Compatibility tests
        run: |
          composer test:integration
          composer test:packages

  postgresql:
    name: PostgreSQL stateful packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nvl_mail_notifications_test_ci
          POSTGRES_USER: nvl
          POSTGRES_PASSWORD: nvl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nvl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Stateful package tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nvl_mail_notifications_test_ci
          DB_USERNAME: nvl
          DB_PASSWORD: nvl
          PGTZ: UTC
        run: |
          for package in activity auth comments content filterable forms mail-notifications media metafields pages seo settings taxonomy templates translations; do
            vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              "packages/nvl/$package/tests"
          done
          composer test:integration

  changed-coverage:
    name: Changed-package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" \
            || "$base_sha" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          packages_json="$({
            git diff --name-only "$base_sha...HEAD" -- packages/nvl \
              | awk -F/ '$1 == "packages" && $2 == "nvl" && NF >= 4 { print $3 }' \
              | sort -u \
              | while IFS= read -r package; do
                  if [[ -f "packages/nvl/$package/composer.json" ]]; then
                    printf '%s\n' "$package"
                  fi
                done
          } | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "packages=$packages_json" >> "$GITHUB_OUTPUT"
          echo "Changed packages: $packages_json"

      - uses: shivammathur/setup-php@v2
        if: steps.changes.outputs.packages != '[]'
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}/packages/nvl
          tools: composer:v2

      - if: steps.changes.outputs.packages != '[]'
        run: composer install --no-interaction --prefer-dist

      - name: Enforce changed-package coverage
        if: steps.changes.outputs.packages != '[]'
        env:
          COVERAGE_BASE_SHA: ${{ steps.changes.outputs.base-sha }}
          PACKAGES_JSON: ${{ steps.changes.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/coverage
          while IFS= read -r package; do
            coverage_arguments=()
            minimum_line=90

            if [[ "$package" == "auth" ]]; then
              coverage_arguments+=(--exclude-testsuite=infrastructure)
            fi

            case "$package" in
              auth) minimum_line=74 ;;
              media) minimum_line=82 ;;
              metafields) minimum_line=67 ;;
              pages) minimum_line=80 ;;
            esac

            vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              --coverage-filter="packages/nvl/$package/src" \
              --coverage-clover="build/coverage/$package.xml" \
              "${coverage_arguments[@]}"
            php tools/check-clover-coverage.php \
              "build/coverage/$package.xml" "$minimum_line" 0
            php tools/check-changed-clover-coverage.php \
              "build/coverage/$package.xml" \
              "$COVERAGE_BASE_SHA" \
              "packages/nvl/$package/src" \
              90
          done < <(jq -r '.[]' <<< "$PACKAGES_JSON")

      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.changes.outputs.packages != '[]' }}
        with:
          name: changed-package-coverage
          path: build/coverage/*.xml
          if-no-files-found: error
          retention-days: 14

name: Package quality

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Invariant package quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Install canonical dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Repository contract tests
        run: vendor/bin/pest --compact tests/Contract

      - name: Validate manifests
        run: |
          composer validate --strict
          for manifest in packages/nvl/*/composer.json; do
            composer validate --strict "$manifest"
          done

      - name: Validate architecture and distributions
        run: |
          composer packages:validate
          composer contracts:check

      - name: Static analysis
        run: |
          composer analyse
          composer packages:analyse

      - name: Formatting
        run: composer format:test

      - name: Dependency analysis
        run: composer dependencies:check

      - name: Generated TypeScript integrity
        run: |
          php artisan nvl:data:types:check
          if [ -f package.json ]; then
            npm ci --ignore-scripts
            npx tsc --noEmit
          fi

      - name: Security audit
        run: composer audit --locked --no-interaction

  package-matrix:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            dependencies: lowest
          - php: '8.4'
            laravel: '12'
            dependencies: highest
          - php: '8.4'
            laravel: '13'
            dependencies: lowest
          - php: '8.5'
            laravel: '13'
            dependencies: highest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Select framework line
        run: |
          composer require --no-update \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "laravel/tinker:^${{ matrix.laravel == '12' && '2.10.1' || '3.0' }}" \
            "orchestra/testbench:^${{ matrix.laravel == '12' && '10' || '11' }}.0"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Package tests
        run: |
          composer test:integration
          composer test:packages

  database-matrix:
    name: Stateful packages / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            health: >-
              --health-cmd="mysqladmin ping -h localhost -uroot -proot"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=10
          - database: pgsql
            image: postgres:17
            port: 5432
            health: >-
              --health-cmd="pg_isready -U nvl"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=10

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: nvl_mail_notifications_test_ci
          MYSQL_USER: nvl
          MYSQL_PASSWORD: nvl
          MYSQL_ROOT_PASSWORD: root
          POSTGRES_DB: nvl_mail_notifications_test_ci
          POSTGRES_USER: nvl
          POSTGRES_PASSWORD: nvl
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: ${{ matrix.health }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_mysql, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Stateful package tests
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: nvl_mail_notifications_test_ci
          DB_USERNAME: nvl
          DB_PASSWORD: nvl
          PGTZ: UTC
        run: |
          for package in activity auth comments content filterable forms mail-notifications media metafields pages seo settings taxonomy templates translations; do
            vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              "packages/nvl/$package/tests"
          done
          composer test:integration

  mail-notifications-mariadb:
    name: Mail Notifications / MariaDB 12.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.1
        env:
          MARIADB_DATABASE: nvl_mail_notifications_test_ci
          MARIADB_USER: nvl
          MARIADB_PASSWORD: nvl
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Mail Notifications MariaDB tests
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nvl_mail_notifications_test_ci
          DB_USERNAME: nvl
          DB_PASSWORD: nvl
        run: |
          vendor/bin/pest \
            --test-directory=packages/nvl/mail-notifications/tests \
            --configuration=packages/nvl/mail-notifications/phpunit.xml.dist \
            --bootstrap=vendor/autoload.php \
            --compact \
            packages/nvl/mail-notifications/tests

  comments-mariadb:
    name: Comments / MariaDB 12.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12.1
        env:
          MARIADB_DATABASE: nvl_comments_test_ci
          MARIADB_USER: nvl
          MARIADB_PASSWORD: nvl
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_mysql, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: Comments MariaDB tests
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nvl_comments_test_ci
          DB_USERNAME: nvl
          DB_PASSWORD: nvl
        run: |
          vendor/bin/pest \
            --test-directory=packages/nvl/comments/tests \
            --configuration=packages/nvl/comments/phpunit.xml.dist \
            --bootstrap=vendor/autoload.php \
            --compact \
            packages/nvl/comments/tests

  line-coverage:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    name: Line coverage / nvl/${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        package:
          - activity
          - auth
          - comments
          - content
          - csv
          - data
          - filterable
          - forms
          - mail-notifications
          - media
          - metafields
          - pages
          - primitives
          - seo
          - settings
          - support
          - taxonomy
          - templates
          - translatable
          - translations

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}/packages/nvl/${{ matrix.package }}/src
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p build/coverage

      - name: Enforce line threshold
        env:
          COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          coverage_arguments=()
          minimum_line=90

          if [ "${{ matrix.package }}" = "auth" ]; then
            coverage_arguments+=(--exclude-testsuite=infrastructure)
          fi

          case "${{ matrix.package }}" in
            auth) minimum_line=74 ;;
            media) minimum_line=82 ;;
            metafields) minimum_line=67 ;;
            pages) minimum_line=80 ;;
          esac

          vendor/bin/pest \
            --test-directory="packages/nvl/${{ matrix.package }}/tests" \
            --configuration="packages/nvl/${{ matrix.package }}/phpunit.xml.dist" \
            --bootstrap=vendor/autoload.php \
            --compact \
            --coverage-filter="packages/nvl/${{ matrix.package }}/src" \
            --coverage-clover="build/coverage/${{ matrix.package }}.xml" \
            "${coverage_arguments[@]}"
          php tools/check-clover-coverage.php \
            "build/coverage/${{ matrix.package }}.xml" "$minimum_line" 0
          if [ -n "$COVERAGE_BASE_SHA" ] \
            && [ "$COVERAGE_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            php tools/check-changed-clover-coverage.php \
              "build/coverage/${{ matrix.package }}.xml" \
              "$COVERAGE_BASE_SHA" \
              "packages/nvl/${{ matrix.package }}/src" \
              90
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-coverage-${{ matrix.package }}
          path: build/coverage/${{ matrix.package }}.xml
          if-no-files-found: error
          retention-days: 14

  standalone-consumers:
    name: Standalone nvl/${{ matrix.package }} on Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        laravel: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["12", "13"]' || '["13"]') }}
        package:
          - activity
          - auth
          - comments
          - content
          - csv
          - data
          - filterable
          - forms
          - mail-notifications
          - media
          - metafields
          - pages
          - primitives
          - seo
          - settings
          - support
          - taxonomy
          - templates
          - translatable
          - translations
        include:
          - laravel: '12'
            package: activity
          - laravel: '12'
            package: comments

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Create clean consumer
        shell: bash
        run: |
          set -euo pipefail
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^${{ matrix.laravel }}.0" \
            /tmp/nvl-consumer
          cd /tmp/nvl-consumer
          composer config --json repositories.nvl \
            "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE/packages/nvl/*\",\"options\":{\"symlink\":false}}"
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require \
            --no-interaction \
            --no-update \
            "nvl/${{ matrix.package }}:@dev"
          composer update \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            --with-all-dependencies \
            --prefer-lowest
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan package:discover
          if [ "${{ matrix.package }}" = "taxonomy" ]; then
            php artisan vendor:publish --tag=taxonomy-config --force
            php -r '
            $path = "config/taxonomy.php";
            $config = require $path;
            $config["owners"] = ["users" => App\Models\User::class];
            file_put_contents($path, "<?php\n\nreturn ".var_export($config, true).";\n");
            '
          fi
          if [ "${{ matrix.package }}" = "activity" ]; then
            export QUEUE_CONNECTION=database
            export DB_QUEUE_RETRY_AFTER=960
          fi
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force
          expected_doctors=/tmp/nvl-expected-doctors
          available_commands=/tmp/nvl-artisan-commands
          jq -r \
            --arg package "${{ matrix.package }}" \
            '.packages[$package].commands // {} | to_entries[] | .value | split(" ")[0] | select(endswith(":doctor"))' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            > "$expected_doctors"
          php artisan list --raw | awk '{print $1}' | sort -u > "$available_commands"
          while IFS= read -r doctor; do
            grep -Fqx "$doctor" "$available_commands" || {
              echo "Expected doctor [$doctor] is not registered." >&2
              exit 1
            }
          done < "$expected_doctors"
          while IFS= read -r doctor; do
            php artisan "$doctor" --strict --format=json
          done < "$expected_doctors"
          # Revert the complete disposable history so every package down
          # migration runs, then reinstall through normal migration discovery.
          if [ "${{ matrix.package }}" = "mail-notifications" ]; then
            php artisan migrate:fresh --force
          else
            php artisan migrate:rollback --force --step=999
            php artisan migrate --force
          fi
          while IFS= read -r doctor; do
            php artisan "$doctor" --strict --format=json
          done < "$expected_doctors"

      - name: Exercise Activity clean consumer
        if: matrix.package == 'activity'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nvl-consumer
          cp -R \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/app/." \
            app/
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/config/activity.php" \
            config/activity.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/bootstrap/providers.php" \
            bootstrap/providers.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/database/migrations/2026_08_02_000001_create_activity_consumer_articles_table.php" \
            database/migrations/2026_08_02_000001_create_activity_consumer_articles_table.php
          composer dump-autoload --no-interaction
          activity_artisan() {
            APP_ENV=production \
            APP_URL=https://activity-consumer.test \
            APP_DEBUG=false \
            DB_QUEUE_RETRY_AFTER=960 \
            QUEUE_CONNECTION=database \
              php artisan "$@"
          }
          activity_artisan config:clear
          activity_artisan route:clear
          activity_artisan config:cache
          activity_artisan route:cache
          activity_artisan migrate --force
          activity_artisan nvl:activity:doctor --strict --format=json
          activity_artisan activity-consumer:smoke --format=json
          activity_artisan activity-consumer:smoke --format=json
          activity_artisan migrate:rollback --force --step=999
          activity_artisan migrate --force
          activity_artisan nvl:activity:doctor --strict --format=json
          activity_artisan activity-consumer:smoke --format=json
          activity_artisan migrate:rollback --force --step=999
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/database/custom-storage-migrations/2026_08_02_000002_create_activity_consumer_activity_log_table.php" \
            database/migrations/2026_08_02_000002_create_activity_consumer_activity_log_table.php
          touch database/activity-consumer.sqlite
          activity_custom_artisan() {
            NVL_ACTIVITY_CUSTOM_STORAGE=true \
            APP_ENV=production \
            APP_URL=https://activity-consumer.test \
            APP_DEBUG=false \
            DB_QUEUE_RETRY_AFTER=960 \
            QUEUE_CONNECTION=database \
              php artisan "$@"
          }
          activity_custom_artisan config:clear
          activity_custom_artisan route:clear
          activity_custom_artisan config:cache
          activity_custom_artisan route:cache
          activity_custom_artisan migrate --force
          activity_custom_artisan nvl:activity:doctor --strict --format=json
          activity_custom_artisan activity-consumer:smoke --format=json
          activity_custom_artisan activity-consumer:smoke --format=json
          activity_custom_artisan migrate:rollback --force --step=999
          activity_custom_artisan migrate --force
          activity_custom_artisan nvl:activity:doctor --strict --format=json
          activity_custom_artisan activity-consumer:smoke --format=json

      - name: Exercise Comments clean consumer
        if: matrix.package == 'comments'
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/tools/run-comments-production-consumer.sh" \
            /tmp/nvl-consumer

  archives:
    name: Distribution archives
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p build/archives

      - name: Resolve archive version
        shell: bash
        run: |
          set -euo pipefail
          package_version=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          php -r 'require "vendor/autoload.php"; (new Composer\Semver\VersionParser)->normalize($argv[1]);' "$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Build and inspect
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_ROOT_VERSION="$PACKAGE_VERSION"
          package_directories=(packages/nvl/*)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            package_names=(comments data filterable media support translatable)
            package_directories=()
            for package in "${package_names[@]}"; do
              package_directories+=("packages/nvl/$package")
            done
          fi
          for directory in "${package_directories[@]}"; do
            package="$(basename "$directory")"
            composer archive \
              --working-dir="$directory" \
              --format=zip \
              --dir="$GITHUB_WORKSPACE/build/archives"
            archive="$(find build/archives -maxdepth 1 -name "nvl-$package-*.zip" -print -quit)"
            php tools/inspect-package-archive.php "$archive" "$package"
          done
          php tools/build-archive-repository.php build/archives "$PACKAGE_VERSION"

      - name: Exercise relocated Activity artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvl-activity-artifacts
          cp \
            "$GITHUB_WORKSPACE"/build/archives/nvl-{activity,data,support}-*.zip \
            /tmp/nvl-activity-artifacts/
          test ! -e /tmp/nvl-activity-artifacts/packages.json
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-activity-archive-consumer
          cd /tmp/nvl-activity-archive-consumer
          composer config repositories.nvl artifact /tmp/nvl-activity-artifacts
          composer require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            --prefer-dist \
            "nvl/activity:$PACKAGE_VERSION"
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $workspace = getenv("GITHUB_WORKSPACE");
          $packages = [];
          foreach ($lock["packages"] ?? [] as $package) {
              if (in_array($package["name"] ?? null, ["nvl/activity", "nvl/data", "nvl/support"], true)) {
                  $packages[$package["name"]] = $package;
              }
          }
          foreach (["nvl/activity", "nvl/data", "nvl/support"] as $name) {
              $package = $packages[$name] ?? null;
              $url = is_array($package) ? ($package["dist"]["url"] ?? null) : null;
              if (! is_array($package)
                  || ($package["version"] ?? null) !== $argv[1]
                  || ($package["dist"]["type"] ?? null) !== "zip"
                  || ! is_string($url)
                  || ! str_starts_with($url, "/tmp/nvl-activity-artifacts/")
                  || (is_string($workspace) && $workspace !== "" && str_contains($url, $workspace))) {
                  fwrite(STDERR, "Invalid relocated artifact provenance for [$name].\n");
                  exit(1);
              }
          }
          $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
          if (isset($manifest["require"]["nvl/data"]) || isset($manifest["require"]["nvl/support"])) {
              fwrite(STDERR, "Transitive NVL packages were added as direct consumer requirements.\n");
              exit(1);
          }
          ' "$PACKAGE_VERSION"
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          cp -R \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/app/." \
            app/
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/config/activity.php" \
            config/activity.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/bootstrap/providers.php" \
            bootstrap/providers.php
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/database/migrations/2026_08_02_000001_create_activity_consumer_articles_table.php" \
            database/migrations/2026_08_02_000001_create_activity_consumer_articles_table.php
          composer dump-autoload --no-interaction
          archive_activity_artisan() {
            APP_ENV=production \
            APP_URL=https://activity-archive-consumer.test \
            APP_DEBUG=false \
            DB_QUEUE_RETRY_AFTER=960 \
            QUEUE_CONNECTION=database \
              php artisan "$@"
          }
          archive_activity_artisan config:clear
          archive_activity_artisan route:clear
          archive_activity_artisan config:cache
          archive_activity_artisan route:cache
          archive_activity_artisan migrate --force
          archive_activity_artisan nvl:activity:doctor --strict --format=json
          archive_activity_artisan activity-consumer:smoke --format=json
          archive_activity_artisan activity-consumer:smoke --format=json
          archive_activity_artisan migrate:rollback --force --step=999
          archive_activity_artisan migrate --force
          archive_activity_artisan nvl:activity:doctor --strict --format=json
          archive_activity_artisan activity-consumer:smoke --format=json
          archive_activity_artisan migrate:rollback --force --step=999
          cp \
            "$GITHUB_WORKSPACE/tools/fixtures/activity-production-consumer/database/custom-storage-migrations/2026_08_02_000002_create_activity_consumer_activity_log_table.php" \
            database/migrations/2026_08_02_000002_create_activity_consumer_activity_log_table.php
          touch database/activity-consumer.sqlite
          archive_activity_custom_artisan() {
            NVL_ACTIVITY_CUSTOM_STORAGE=true \
            APP_ENV=production \
            APP_URL=https://activity-archive-consumer.test \
            APP_DEBUG=false \
            DB_QUEUE_RETRY_AFTER=960 \
            QUEUE_CONNECTION=database \
              php artisan "$@"
          }
          archive_activity_custom_artisan config:clear
          archive_activity_custom_artisan route:clear
          archive_activity_custom_artisan config:cache
          archive_activity_custom_artisan route:cache
          archive_activity_custom_artisan migrate --force
          archive_activity_custom_artisan nvl:activity:doctor --strict --format=json
          archive_activity_custom_artisan activity-consumer:smoke --format=json
          archive_activity_custom_artisan migrate:rollback --force --step=999
          archive_activity_custom_artisan migrate --force
          archive_activity_custom_artisan nvl:activity:doctor --strict --format=json
          archive_activity_custom_artisan activity-consumer:smoke --format=json
          composer audit --locked --no-interaction

      - name: Exercise relocated Comments artifacts
        shell: bash
        run: |
          set -euo pipefail
          for laravel in 12 13; do
            "$GITHUB_WORKSPACE/tools/run-comments-artifact-consumer.sh" \
              "$laravel" \
              "$PACKAGE_VERSION" \
              "$GITHUB_WORKSPACE/build/archives" \
              "/tmp/nvl-comments-archive-consumer-$laravel"
          done

      - name: Install and exercise built archives
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          composer create-project \
            --no-interaction \
            --no-dev \
            --prefer-dist \
            "laravel/laravel:^13.0" \
            /tmp/nvl-archive-consumer
          cd /tmp/nvl-archive-consumer
          composer config repositories.nvl artifact "$GITHUB_WORKSPACE/build/archives"
          packages=()
          for directory in "$GITHUB_WORKSPACE"/packages/nvl/*; do
            packages+=("nvl/$(basename "$directory"):$PACKAGE_VERSION")
          done
          composer require \
            --no-interaction \
            --update-no-dev \
            --with-all-dependencies \
            "${packages[@]}"
          cp .env.example .env
          cp "$GITHUB_WORKSPACE/app/Models/IntegrationTestModel.php" app/Models/IntegrationTestModel.php
          cp "$GITHUB_WORKSPACE/app/Providers/AppServiceProvider.php" app/Providers/AppServiceProvider.php
          cp \
            "$GITHUB_WORKSPACE/database/migrations/2026_07_25_205913_create_integration_test_models_table.php" \
            database/migrations/2026_07_25_205913_create_integration_test_models_table.php
          touch database/database.sqlite
          php artisan key:generate
          composer dump-autoload --no-interaction
          php artisan package:discover
          export QUEUE_CONNECTION=database
          export DB_QUEUE_RETRY_AFTER=960
          php artisan config:cache
          php artisan route:cache
          php artisan migrate --force
          publish_tags=/tmp/nvl-publish-tags
          jq -r '.packages[].publish_tags[]' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            > "$publish_tags"
          while IFS= read -r tag; do
            php artisan vendor:publish --tag="$tag" --force
          done < "$publish_tags"
          php artisan migrate --force
          expected_doctors=/tmp/nvl-expected-doctors
          available_doctors=/tmp/nvl-available-doctors
          jq -r \
            '.packages[].commands // {} | to_entries[] | .value | split(" ")[0] | select(endswith(":doctor"))' \
            "$GITHUB_WORKSPACE/tools/package-contracts.json" \
            | sort -u > "$expected_doctors"
          php artisan list --raw \
            | awk '$1 ~ /^nvl:.*:doctor$/ {print $1}' \
            | sort -u > "$available_doctors"
          diff -u "$expected_doctors" "$available_doctors"
          run_doctors() {
            while IFS= read -r doctor; do
              if [ "$doctor" = "nvl:auth:doctor" ]; then
                APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=database \
                  php artisan "$doctor" --strict --format=json
              else
                APP_ENV=testing MAIL_MAILER=array QUEUE_CONNECTION=database \
                  php artisan "$doctor" --strict --format=json
              fi
            done < "$expected_doctors"
          }
          run_doctors
          php artisan migrate:rollback --force
          # Forward-only package downs retain schema by design. Rebuild this
          # disposable consumer explicitly before proving a clean reinstall.
          php artisan migrate:fresh --force
          run_doctors
          composer audit --locked --no-interaction

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: nvl-package-archives-${{ github.ref_name }}
          path: build/archives
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub and Composer release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - package-matrix
      - database-matrix
      - mail-notifications-mariadb
      - comments-mariadb
      - line-coverage
      - standalone-consumers
      - archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip
          coverage: none

      - uses: actions/download-artifact@v4
        with:
          name: nvl-package-archives-${{ github.ref_name }}
          path: build/archives

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build public Composer repository metadata
        shell: bash
        env:
          COMPOSER_REPOSITORY_URL: ${{ steps.pages.outputs.base_url }}
          DIST_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          archive_count="$(find build/archives -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')"
          test "$archive_count" -eq 20
          mkdir -p build/public
          previous_repository=()
          previous_url="${COMPOSER_REPOSITORY_URL%/}/packages.json"
          if curl --fail --location --silent --show-error \
            "$previous_url" \
            --output build/previous-packages.json; then
            previous_repository=(build/previous-packages.json)
          else
            previous_tag="$(git tag --list 'v*' --sort=-v:refname \
              | grep -Fxv "$GITHUB_REF_NAME" \
              | head -n 1 \
              || true)"
            if [[ -n "$previous_tag" ]]; then
              echo "Unable to fetch the existing Composer index containing [$previous_tag]." >&2
              exit 1
            fi
          fi
          php tools/build-public-composer-repository.php \
            build/archives \
            "$package_version" \
            "$DIST_BASE_URL" \
            build/public/packages.json \
            "${previous_repository[@]}"
          touch build/public/.nojekyll

      - name: Publish immutable GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir -p build/existing-release
            gh release download \
              "$GITHUB_REF_NAME" \
              --pattern 'nvl-*.zip' \
              --dir build/existing-release
            existing_count="$(find build/existing-release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')"
            test "$existing_count" -eq 20
            for archive in build/archives/*.zip; do
              cmp -s "$archive" "build/existing-release/$(basename "$archive")"
            done
          else
            release_flags=()
            if [[ "$package_version" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create \
              "$GITHUB_REF_NAME" \
              build/archives/*.zip \
              --verify-tag \
              --generate-notes \
              --title "NVL Laravel Suite $package_version" \
              "${release_flags[@]}"
          fi

      - name: Upload Composer repository to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/public

  deploy-composer-repository:
    name: Deploy Composer repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Composer repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

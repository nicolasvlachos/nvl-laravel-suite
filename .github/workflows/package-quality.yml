name: Package quality

on:
  pull_request:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, analysis, manifests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: none
          tools: composer:2.10.2

      - name: Install dependencies
        shell: bash
        run: bash tools/retry-composer.sh install --no-interaction --prefer-dist

      - name: Repository contract tests
        run: vendor/bin/pest --compact tests/Contract

      - name: Validate Composer manifests
        run: |
          composer validate --strict
          for manifest in packages/nvl/*/composer.json; do
            composer validate --strict "$manifest"
          done

      - name: Validate optimized autoloading
        run: composer autoload:check

      - name: Validate architecture and public contracts
        run: |
          composer packages:validate
          composer contracts:check

      - name: Static analysis
        run: |
          composer analyse
          composer packages:analyse

      - name: Formatting
        run: composer format:test

  current-tests:
    name: PHP 8.4 / Laravel 13 / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:2.10.2

      - name: Select Laravel 13
        run: |
          composer require --no-update \
            "laravel/framework:^13.0" \
            "laravel/tinker:^3.0" \
            "orchestra/testbench:^11.0"

      - name: Install dependencies
        shell: bash
        run: bash tools/retry-composer.sh update --no-interaction --prefer-dist --with-all-dependencies

      - name: Complete test suite
        run: composer test

  laravel13-lowest:
    name: PHP 8.4 / Laravel 13 / lowest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:2.10.2

      - name: Select Laravel 13
        run: |
          composer require --no-update \
            "laravel/framework:^13.0" \
            "laravel/tinker:^3.0" \
            "orchestra/testbench:^11.0"

      - name: Install lowest supported dependencies
        shell: bash
        run: bash tools/retry-composer.sh update --no-interaction --prefer-dist --with-all-dependencies --prefer-lowest

      - name: Compatibility tests
        run: |
          composer test:integration
          composer test:packages

  postgresql:
    name: PostgreSQL stateful packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nvl_package_test_admin
          POSTGRES_USER: nvl
          POSTGRES_PASSWORD: nvl
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nvl"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:2.10.2

      - name: Install dependencies
        shell: bash
        run: bash tools/retry-composer.sh install --no-interaction --prefer-dist

      - name: Stateful package tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: nvl
          DB_PASSWORD: nvl
          PGTZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          for package in activity auth comments content filterable forms mail-notifications media metafields pages seo settings taxonomy templates translatable translations; do
            database="nvl_${package//-/_}_test_ci"
            DATABASE_NAME="$database" php -r '
              $database = getenv("DATABASE_NAME");
              if (! is_string($database) || preg_match("/^nvl_[a-z_]+_test_ci$/", $database) !== 1) {
                  throw new RuntimeException("Unsafe test database name.");
              }
              $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=nvl_package_test_admin", "nvl", "nvl");
              $pdo->exec("CREATE DATABASE \"{$database}\"");
            '
            DB_DATABASE="$database" vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              "packages/nvl/$package/tests"
          done
          DATABASE_NAME=nvl_package_test_integration php -r '
            $database = getenv("DATABASE_NAME");
            if ($database !== "nvl_package_test_integration") {
                throw new RuntimeException("Unsafe integration test database name.");
            }
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=nvl_package_test_admin", "nvl", "nvl");
            $pdo->exec("CREATE DATABASE \"{$database}\"");
          '
          DB_DATABASE=nvl_package_test_integration composer test:integration

  mysql-family:
    name: ${{ matrix.name }} stateful packages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
          - name: MariaDB 12.3
            image: mariadb:12.3
            connection: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pcntl, pdo_mysql, zip
          coverage: none
          tools: composer:2.10.2

      - name: Install dependencies
        shell: bash
        run: bash tools/retry-composer.sh install --no-interaction --prefer-dist

      - name: Stateful package tests
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        shell: bash
        run: |
          set -euo pipefail
          for package in activity auth comments content filterable forms mail-notifications media metafields pages seo settings taxonomy templates translatable translations; do
            database="nvl_${package//-/_}_test_ci"
            DATABASE_NAME="$database" php -r '
              $database = getenv("DATABASE_NAME");
              if (! is_string($database) || preg_match("/^nvl_[a-z_]+_test_ci$/", $database) !== 1) {
                  throw new RuntimeException("Unsafe test database name.");
              }
              $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
              $pdo->exec("CREATE DATABASE `{$database}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
            '
            DB_DATABASE="$database" vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              "packages/nvl/$package/tests"
          done
          DATABASE_NAME=nvl_package_test_integration php -r '
            $database = getenv("DATABASE_NAME");
            if ($database !== "nvl_package_test_integration") {
                throw new RuntimeException("Unsafe integration test database name.");
            }
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
            $pdo->exec("CREATE DATABASE `{$database}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
          '
          DB_DATABASE=nvl_package_test_integration composer test:integration

  changed-coverage:
    name: Changed-package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" \
            || "$base_sha" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          packages_json="$({
            git diff --name-only "$base_sha...HEAD" -- packages/nvl \
              | awk -F/ '$1 == "packages" && $2 == "nvl" && $4 == "src" && $NF ~ /\.php$/ { print $3 }' \
              | sort -u \
              | while IFS= read -r package; do
                  if [[ -f "packages/nvl/$package/composer.json" ]]; then
                    printf '%s\n' "$package"
                  fi
                done
          } | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "packages=$packages_json" >> "$GITHUB_OUTPUT"
          echo "Changed source packages: $packages_json"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.changes.outputs.packages != '[]'
        with:
          php-version: '8.4'
          extensions: ctype, dom, fileinfo, filter, gd, intl, json, libxml, mbstring, pdo_sqlite, simplexml, zip
          coverage: pcov
          ini-values: pcov.directory=${{ github.workspace }}/packages/nvl
          tools: composer:2.10.2

      - name: Install dependencies
        if: steps.changes.outputs.packages != '[]'
        shell: bash
        run: bash tools/retry-composer.sh install --no-interaction --prefer-dist

      - name: Enforce changed-package coverage
        if: steps.changes.outputs.packages != '[]'
        env:
          COVERAGE_BASE_SHA: ${{ steps.changes.outputs.base-sha }}
          PACKAGES_JSON: ${{ steps.changes.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/coverage
          while IFS= read -r package; do
            coverage_arguments=()
            minimum_line=90

            if [[ "$package" == "auth" ]]; then
              coverage_arguments+=(--exclude-testsuite=infrastructure)
            fi

            case "$package" in
              auth) minimum_line=74 ;;
              mail-notifications) minimum_line=88 ;;
              media) minimum_line=82 ;;
              metafields) minimum_line=67 ;;
              pages) minimum_line=80 ;;
            esac

            vendor/bin/pest \
              --test-directory="packages/nvl/$package/tests" \
              --configuration="packages/nvl/$package/phpunit.xml.dist" \
              --bootstrap=vendor/autoload.php \
              --compact \
              --coverage-filter="packages/nvl/$package/src" \
              --coverage-clover="build/coverage/$package.xml" \
              "${coverage_arguments[@]}"
            php tools/check-clover-coverage.php \
              "build/coverage/$package.xml" "$minimum_line" 0
            php tools/check-changed-clover-coverage.php \
              "build/coverage/$package.xml" \
              "$COVERAGE_BASE_SHA" \
              "packages/nvl/$package/src" \
              90
          done < <(jq -r '.[]' <<< "$PACKAGES_JSON")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.changes.outputs.packages != '[]' }}
        with:
          name: changed-package-coverage
          path: build/coverage/*.xml
          if-no-files-found: error
          retention-days: 14
